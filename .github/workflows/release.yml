name: Release

# Tag v* (for example v0.2.0 or v0.2.0-rc.1): build the Windows installer and the Agent
# binaries / container image, then publish a GitHub Release with checksums.
# Any other push builds the same installer and Agent packages as a "dev" version and keeps
# them as downloadable workflow artifacts (no image push, no release).
on:
  push:
    tags: ["v*"]
    branches: ["**"]
    paths-ignore: ["**.md", "docs/**"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  windows:
    name: Installer (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Version
        id: ver
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            # Accept v1.2.3 and the common typo v.1.2.3; anything else must still be semver.
            version="${GITHUB_REF_NAME#v}"
            version="${version#.}"
          else
            version="0.1.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error title=Version::Tag '$GITHUB_REF_NAME' is not a version. Use v<major>.<minor>.<patch>, e.g. v0.2.0 or v0.2.0-beta.1."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The Agent is published by the Linux job; here only Server + Tray are needed.
      - name: Publish
        shell: pwsh
        run: ./build/publish.ps1 -Version '${{ steps.ver.outputs.version }}' -OutputDir artifacts -SkipAgent

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      # Inno Setup 6.x or 7.x installs into a versioned folder, so search for ISCC.exe.
      - name: Build installer
        shell: pwsh
        run: |
          $roots = @(${env:ProgramFiles(x86)}, $env:ProgramFiles, $env:LOCALAPPDATA) | Where-Object { $_ -and (Test-Path $_) }
          $iscc = $null
          foreach ($r in $roots) {
            $iscc = Get-ChildItem -Path $r -Directory -Filter 'Inno Setup*' -ErrorAction SilentlyContinue |
              ForEach-Object { Join-Path $_.FullName 'ISCC.exe' } |
              Where-Object { Test-Path $_ } | Sort-Object -Descending | Select-Object -First 1
            if ($iscc) { break }
          }
          if (-not $iscc) {
            $cmd = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($cmd) { $iscc = $cmd.Source }
          }
          if (-not $iscc) { throw 'ISCC.exe not found after installing Inno Setup.' }
          Write-Host "Using $iscc"
          $stage = (Resolve-Path 'artifacts/stage').Path
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" "/DStageDir=$stage" 'installer/VuStudio.iss'
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: artifacts/installer/VuStudio-Setup-*.exe
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Agent (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Version
        id: ver
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            # Accept v1.2.3 and the common typo v.1.2.3; anything else must still be semver.
            version="${GITHUB_REF_NAME#v}"
            version="${version#.}"
          else
            version="0.1.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error title=Version::Tag '$GITHUB_REF_NAME' is not a version. Use v<major>.<minor>.<patch>, e.g. v0.2.0 or v0.2.0-beta.1."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish Agent
        run: |
          set -euo pipefail
          for rid in linux-x64 linux-arm64 win-x64; do
            dotnet publish src/VuStudio.Agent/VuStudio.Agent.csproj -c Release -r "$rid" \
              --self-contained true -p:PublishSingleFile=true \
              -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none \
              -p:Version="${{ steps.ver.outputs.version }}" -p:ContinuousIntegrationBuild=true \
              -o "artifacts/agent/$rid"
          done

      - name: Package Agent
        run: |
          set -euo pipefail
          mkdir -p artifacts/release
          v="${{ steps.ver.outputs.version }}"
          for rid in linux-x64 linux-arm64; do
            chmod +x "artifacts/agent/$rid/vustudio-agent"
            tar -C "artifacts/agent/$rid" -czf "artifacts/release/vustudio-agent-$v-$rid.tar.gz" .
          done
          (cd artifacts/agent/win-x64 && zip -qr "../../release/vustudio-agent-$v-win-x64.zip" .)

      - name: Upload Agent packages
        uses: actions/upload-artifact@v4
        with:
          name: agent
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 30

  # The multi-arch Agent image. Separate from the release so a registry or Docker problem never
  # holds back the installer and the binaries.
  image:
    name: Agent image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Version
        id: ver
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            # Accept v1.2.3 and the common typo v.1.2.3; anything else must still be semver.
            version="${GITHUB_REF_NAME#v}"
            version="${version#.}"
          else
            version="0.1.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error title=Version::Tag '$GITHUB_REF_NAME' is not a version. Use v<major>.<minor>.<patch>, e.g. v0.2.0 or v0.2.0-beta.1."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The image is built and pushed for tags only.
      - name: Detect Agent Dockerfile
        id: docker
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ -f deploy/agent/Dockerfile ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Docker::Not a release tag or no deploy/agent/Dockerfile, skipping the image."
          fi

      - name: Lowercase image name
        if: steps.docker.outputs.present == 'true'
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/vustudio-agent" >> "$GITHUB_ENV"

      - name: Set up QEMU
        if: steps.docker.outputs.present == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        if: steps.docker.outputs.present == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: steps.docker.outputs.present == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        if: steps.docker.outputs.present == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.ver.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.ver.outputs.version }},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push image
        if: steps.docker.outputs.present == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}

  release:
    name: GitHub Release
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          set -euo pipefail
          ls -l
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
