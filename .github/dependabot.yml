# Dependabot version updates: one weekly pass per ecosystem.
# Reference: https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2

updates:
  # .NET packages. All versions are central, in Directory.Packages.props.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Packages that ship with the .NET 10 release train move together.
      dotnet-platform:
        patterns:
          - "Microsoft.Extensions.*"
          - "Microsoft.Data.Sqlite"
          - "System.*"
      testing:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
      skiasharp:
        patterns:
          - "SkiaSharp*"
    ignore:
      # The project targets net10.0, so the next major of these needs a TFM bump first.
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Data.Sqlite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.IO.Ports"
        update-types: ["version-update:semver-major"]

  # Web UI (React + Vite + TypeScript). Dependabot reports a harmless
  # "directory not found" for this entry until web/package.json exists.
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]

  # Actions used by the workflows in .github/workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
